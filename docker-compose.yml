services:

  api:
    build:
      context: .
      dockerfile: ChatSystem.API/ChatSystem.API/Dockerfile

    container_name: chatsystem-api

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Jwt__Key: ${JWT_SECRET}

    depends_on:
      - redis
      - rabbitmq

  redis:
    image: redis:7-alpine

    container_name: chatsystem-redis

    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management

    container_name: chatsystem-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123